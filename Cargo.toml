# Rust workspace of Symaira Cockpit (ADR 0001/0003): grows next to the Swift packages
# (Package.swift, tuning/, history/) until the Swift core is retired.
[workspace]
members = [
    "crates/symcockpit-contract",
    "crates/symcockpit-core",
    "crates/symcockpit-macos",
    "crates/symcockpit-testkit",
    "crates/symcockpit-store",
    "crates/symcockpit-db",
    "crates/symcockpit-ffi",
    "crates/symcockpit-helper-proto",
    "crates/symcockpit-helper",
    "crates/symcockpit",
    "crates/symcockpit-oracle",
]
resolver = "3"

[workspace.package]
version = "0.13.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/danieljustus/symaira-cockpit"
publish = false

[workspace.dependencies]
symcockpit-contract = { path = "crates/symcockpit-contract", version = "=0.13.0" }
# Shared Symaira foundations are pinned by immutable release tag so Dependabot
# can move them, like every Rust consumer:
#   { git = "https://github.com/danieljustus/symaira-corekit",
#     tag = "v0.28.0", version = "=0.0.0" }
# No CoreKit crate is used yet: symaira-core-exit numbers codes differently
# (4 = forbidden, Cockpit: 4 = unsupported) and symaira-core-version has no
# `families`/`update` fields. Add the pin with the first crate that fits.
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tempfile = "=3.23.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
