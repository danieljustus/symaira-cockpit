name: SymairaTune
options:
  bundleIdPrefix: com.symaira
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false

packages:
  symaira-appkit:
    url: https://github.com/danieljustus/symaira-appkit.git
    revision: "39dbab726db39ecd88814ae5e9b20ff7705cebfa"

targets:
  SymTuneCore:
    type: library.static
    platform: macOS
    sources:
      - Sources/SymTuneCore
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"
        OTHER_LDFLAGS:
          - "-framework"
          - "AppKit"
          - "-framework"
          - "IOKit"

  # The menu-bar UI, as its own module — symcockpit's GUI embeds the same
  # library through SPM, so the Xcode project mirrors that split instead of
  # compiling the views straight into the app target.
  SymTuneUI:
    type: library.static
    platform: macOS
    sources:
      - Sources/SymTuneUI
    dependencies:
      - target: SymTuneCore
      - package: symaira-appkit
        product: SymairaUpdateCheck
      - package: symaira-appkit
        product: SymairaTheme
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"
        OTHER_LDFLAGS:
          - "-framework"
          - "AppKit"

  SymairaTune:
    type: application
    platform: macOS
    sources:
      - Sources/SymTuneApp
    dependencies:
      - target: SymTuneUI
      - target: SymTuneCore
      - package: symaira-appkit
        product: SymairaUpdateCheck
      - package: symaira-appkit
        product: SymairaTheme
    settings:
      base:
        INFOPLIST_FILE: Sources/SymTuneApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.symaira.tune
        PRODUCT_NAME: "Symaira Tune"
        EXECUTABLE_NAME: SymairaTune
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
        OTHER_LDFLAGS:
          - "-framework"
          - "AppKit"
          - "-framework"
          - "IOKit"
