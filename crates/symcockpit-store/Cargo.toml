[package]
name = "symcockpit-store"
description = "Persisted data formats shared with v0.12."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
symcockpit-contract.workspace = true
symcockpit-core = { path = "../symcockpit-core", version = "=0.12.2" }
