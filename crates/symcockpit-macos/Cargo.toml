[package]
name = "symcockpit-macos"
description = "macOS platform adapters. `unsafe` is allowed in this crate only (ADR 0004)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# No `unsafe_code` entry on purpose: this is the one crate allowed to use it.
[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
symcockpit-core = { path = "../symcockpit-core", version = "=0.12.2" }
libc = "=0.2.191"
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFBase", "CFDictionary", "CFNumber", "CFString"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "alloc", "NSProcessInfo"] }
serde_json.workspace = true

[dev-dependencies]
symcockpit-testkit = { path = "../symcockpit-testkit" }
tempfile.workspace = true
