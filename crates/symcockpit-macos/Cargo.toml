[package]
name = "symcockpit-macos"
description = "macOS platform adapters. `unsafe` is allowed in this crate only (ADR 0004)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# No `unsafe_code` entry on purpose: this is the one crate allowed to use it.
[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
symcockpit-contract.workspace = true
symcockpit-core = { path = "../symcockpit-core", version = "=0.13.1" }
symcockpit-store = { path = "../symcockpit-store", version = "=0.13.1" }
symcockpit-helper-proto = { path = "../symcockpit-helper-proto", version = "=0.13.1" }
libc = "=0.2.191"
# Moves files to the Trash through NSFileManager (MIT).
trash = "=5.4.0"
# Info.plist of app bundles (MIT).
plist = "=1.10.4"
# Keychain access for the clipboard key (MIT OR Apache-2.0); default features off.
security-framework = { version = "=3.7.0", default-features = false }
core-foundation = "=0.10.1"
core-foundation-sys = "=0.8.7"
objc2 = "=0.6.5"
# Blocks for the XPC handlers; already in the lock file through objc2 (Zlib OR Apache-2.0 OR MIT).
block2 = "=0.6.2"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSScreen", "NSGraphics", "NSPasteboard", "NSRunningApplication", "NSWorkspace", "NSApplication", "NSWindow", "NSView", "NSResponder", "NSColor", "objc2-core-foundation", "objc2-quartz-core"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFBase", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGDirectDisplay", "CGDisplayConfiguration", "CGColorSpace", "libc"] }
# Extended-brightness trigger: a 1x1 CAMetalLayer that is really presented (MIT OR Apache-2.0 OR Zlib).
objc2-metal = { version = "=0.3.2", default-features = false, features = ["std", "MTLDevice", "MTLCommandQueue", "MTLCommandBuffer", "MTLRenderPass", "MTLRenderCommandEncoder", "MTLTexture", "MTLPixelFormat", "MTLDrawable", "MTLCommandEncoder", "MTLResource"] }
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = ["std", "CAMetalLayer", "CALayer", "objc2-metal", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-foundation = "=0.3.2"
# CoreBluetooth through objc2 rather than btleplug: no async runtime (architecture section 10),
# and the same bindings serve virtual peripherals later (R54). All Zlib OR Apache-2.0 OR MIT.
objc2-core-bluetooth = "=0.3.2"
dispatch2 = "=0.3.1"
objc2-core-audio = "=0.3.2"
objc2-core-audio-types = "=0.3.2"
# Client and notifications only: the crate has no device or entity traversal.
coremidi = "=0.9.2"
coremidi-sys = "=3.2.1"
serde_json.workspace = true

[dev-dependencies]
symcockpit-oracle = { path = "../symcockpit-oracle", version = "=0.13.1" }
symcockpit-testkit = { path = "../symcockpit-testkit", version = "=0.13.1" }
tempfile.workspace = true
