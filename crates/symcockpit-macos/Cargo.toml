[package]
name = "symcockpit-macos"
description = "macOS platform adapters. `unsafe` is allowed in this crate only (ADR 0004)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# No `unsafe_code` entry on purpose: this is the one crate allowed to use it.
[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
symcockpit-contract.workspace = true
symcockpit-core = { path = "../symcockpit-core", version = "=0.12.2" }
libc = "=0.2.191"
# Moves files to the Trash through NSFileManager (MIT).
trash = "=5.4.0"
# Info.plist of app bundles (MIT).
plist = "=1.10.4"
core-foundation = "=0.10.1"
core-foundation-sys = "=0.8.7"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSScreen", "NSGraphics", "objc2-core-foundation"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFBase", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGDirectDisplay", "CGDisplayConfiguration", "libc"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "alloc", "NSProcessInfo", "NSString", "NSDictionary", "NSValue", "NSEnumerator", "NSArray"] }
serde_json.workspace = true

[dev-dependencies]
symcockpit-oracle = { path = "../symcockpit-oracle", version = "=0.12.2" }
symcockpit-testkit = { path = "../symcockpit-testkit", version = "=0.12.2" }
tempfile.workspace = true
