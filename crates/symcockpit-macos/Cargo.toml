[package]
name = "symcockpit-macos"
description = "macOS platform adapters. `unsafe` is allowed in this crate only (ADR 0004)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# No `unsafe_code` entry on purpose: this is the one crate allowed to use it.
[lints.clippy]
all = { level = "warn", priority = -1 }

[target.'cfg(target_os = "macos")'.dependencies]
symcockpit-core = { path = "../symcockpit-core" }
objc2 = "=0.6.5"
objc2-core-audio = "=0.3.2"
objc2-core-audio-types = "=0.3.2"
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["CFDictionary"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSValue", "NSUUID", "NSObject"] }
# Client and notifications only: the crate has no device or entity traversal.
coremidi = "=0.9.2"
coremidi-sys = "=3.2.1"
core-foundation-sys = "=0.8.7"
