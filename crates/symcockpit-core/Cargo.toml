[package]
name = "symcockpit-core"
description = "Domain modules and rules (monitor, tune, ...); no platform access."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
symcockpit-contract.workspace = true
symcockpit-store = { path = "../symcockpit-store", version = "=0.13.0" }
symcockpit-helper-proto = { path = "../symcockpit-helper-proto", version = "=0.13.0" }
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
# powermetrics' plist output (root-only GPU fallback)
plist = "=1.10.4"
# Plan digests and duplicate hashing (RustCrypto, MIT OR Apache-2.0).
sha2 = "=0.10.9"
# Clipboard history encryption (RustCrypto, Apache-2.0 OR MIT). AES-256-GCM only.
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc"] }
# Plan ids and clipboard nonces/keys; no other randomness is needed.
getrandom = "=0.3.4"

[dev-dependencies]
symcockpit-testkit = { path = "../symcockpit-testkit", version = "=0.13.0" }
csv = "=1.4.0"
tempfile.workspace = true
