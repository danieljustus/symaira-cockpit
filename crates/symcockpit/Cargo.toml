[package]
name = "symcockpit"
description = "Symaira Cockpit command line: `version` natively, everything else forwarded to the Swift core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
symcockpit-contract.workspace = true
symcockpit-db = { path = "../symcockpit-db", version = "=0.12.2" }
symcockpit-core = { path = "../symcockpit-core", version = "=0.12.2" }
symcockpit-helper-proto = { path = "../symcockpit-helper-proto", version = "=0.12.2" }
symcockpit-macos = { path = "../symcockpit-macos", version = "=0.12.2" }
symcockpit-store = { path = "../symcockpit-store", version = "=0.12.2" }
serde.workspace = true
serde_json.workspace = true
jiff = { version = "=0.2.42", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }

[dev-dependencies]
symcockpit-testkit = { path = "../symcockpit-testkit", version = "=0.12.2" }
tempfile.workspace = true

[lints]
workspace = true
