version: 2
updates:
  # CoreKit crates get their own daily group; a broader cargo group would win
  # and drop the Git tag bump, so none is declared here.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      exclude: ["symaira-core-*"]
    groups:
      symaira-corekit:
        patterns: ["symaira-core-*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      symaira-corekit:
        patterns: ["danieljustus/symaira-corekit*"]
  # Dependabot may move only tuning/Package.swift and never edits
  # tuning/project.yml. The CoreKit Dependabot workflow raises the root
  # Package.swift, Package.resolved and project.yml in the same PR;
  # scripts/check-corekit-pins.sh fails CI on any drift that remains.
  - package-ecosystem: swift
    directories:
      - /
      - /tuning
    schedule:
      interval: "daily"
    cooldown:
      exclude: ["*symaira-corekit*"]
    groups:
      symaira-corekit:
        patterns: ["*symaira-corekit*"]
