name: Release

on:
  push:
    tags:
      - 'v*'

# No workflow-wide token scope: each job declares exactly what it uses, so the
# secret-bearing `release` environment jobs cannot write more than they need.
permissions: {}

# Two pushes of the same tag must not race the release upload or the tap bump.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Packaging (architecture 5.4, D16): arm64 only. The shipped command
# line is the Rust `symcockpit` (crates/symcockpit); the app bundle embeds that
# same binary as its agent and CLI, plus the privileged helper and the Quick
# Look / FinderSync extensions. One version source: Cargo.toml
# `[workspace.package] version` (scripts/set-version.sh writes it, and
# scripts/check-version.sh proves every other declaration equals it and the tag).

jobs:
  release:
    name: Build and publish the CLI
    permissions:
      contents: write # gh release create
    # macOS-only by construction: the cockpit drives AppKit, IOKit,
    # Accessibility and ScreenCaptureKit. macos-latest is Apple Silicon.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify the tag matches every version declaration
        # A tag that disagrees with the compiled-in version would ship a
        # binary that misreports itself, and Homebrew's `test do` block would
        # fail after the release is already public.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/check-version.sh "$VERSION"

      - name: Resolve the pinned Rust toolchain
        # Same pin as ci.yml: rust-toolchain.toml. Fail when the toolchain in
        # use is not the pinned channel.
        run: |
          set -euo pipefail
          rustup show active-toolchain
          want="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustc --version | grep -q "^rustc $want " || {
            echo "::error::rustc is not the pinned $want: $(rustc --version)"
            exit 1
          }

      - name: Test the Rust workspace
        run: cargo test --locked

      - name: Build the arm64 CLI
        run: cargo build --release --locked -p symcockpit --target aarch64-apple-darwin

      - name: Package the CLI
        # Strips, signs ad hoc (the arm64 minimum), checks the binary is arm64
        # only and reports the tag's version, then writes
        # symcockpit_<version>_darwin_arm64.tar.gz and checksums.txt.
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          archive="$(./scripts/package-cli.sh "$VERSION" target/aarch64-apple-darwin/release/symcockpit dist | tail -1)"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          cat dist/checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        # The CLI tarball is not Developer-ID signed or notarized: Homebrew
        # installs it without a quarantine attribute, so it runs as it is. The
        # signed and notarized app (which carries the same binary) follows in
        # release-macos-app; the tap is bumped only after both exist.
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            "$ARCHIVE" \
            dist/checksums.txt

  # ---------------------------------------------------------------------------
  # GUI release path. Symaira Cockpit.app is assembled by scripts/build-app.sh
  # straight from the SwiftPM product (no Xcode project on purpose) and signed
  # there, nested parts first and each with its own identity and entitlements,
  # with the Developer ID certificate, Hardened Runtime and a secure timestamp.
  # Nothing re-signs afterwards (a blanket re-sign would drop the extensions'
  # sandbox entitlements). Then: notarized with an App Store Connect API key,
  # packaged into a branded DMG and uploaded to the same release as the CLI.
  # Fail-closed: a stable release never ships an unsigned or un-notarized app.
  # ---------------------------------------------------------------------------
  release-macos-app:
    name: Signed and notarized Symaira Cockpit.app
    runs-on: macos-26
    environment: release
    needs: release
    permissions:
      contents: write # gh release upload / download
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.4.1'

      - name: Verify Xcode toolchain
        run: |
          set -euo pipefail
          XCODE_VERSION="$(xcodebuild -version)"
          echo "$XCODE_VERSION"
          XCODE_MAJOR="${XCODE_VERSION#Xcode }"
          XCODE_MAJOR="${XCODE_MAJOR%%.*}"
          if ! [[ "$XCODE_MAJOR" =~ ^[0-9]+$ ]] || (( XCODE_MAJOR < 26 )); then
            echo "::error::Expected Xcode 26 or newer, got: $XCODE_VERSION"
            exit 1
          fi

      - name: Make the Metal toolchain usable
        # Release builds compile the shared AppKit topography shader
        # (SymairaTopo.metal). On hosted runners the Xcode Metal shims that
        # Swift Build calls fail even though the component is installed;
        # the script routes them to the real tools.
        run: bash scripts/ci-metal-toolchain.sh

      - name: Resolve the pinned Rust toolchain
        # build-app.sh builds the agent, the helper and the extension library
        # with cargo; same pin as ci.yml and the CLI job.
        run: |
          set -euo pipefail
          rustup show active-toolchain
          want="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustc --version | grep -q "^rustc $want " || {
            echo "::error::rustc is not the pinned $want: $(rustc --version)"
            exit 1
          }

      - name: Resolve version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify the tag matches every version declaration
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/check-version.sh "$VERSION"

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          for secret in CERTIFICATE_P12 CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD; do
            if [ -z "${!secret:-}" ]; then
              echo "::error::$secret must be configured in the release environment."
              exit 1
            fi
          done

          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          echo -n "$CERTIFICATE_P12" | base64 --decode -o "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found in the configured certificate."
            exit 1
          fi
          # The expected team is read from the certificate itself (subject OU),
          # never typed in: the app and the fan helper embed it at build time
          # and will pair with no other team. It is checked again against the
          # signed bundle below.
          TEAM_ID=$(security find-certificate -c "$IDENTITY" -p "$KEYCHAIN_PATH" \
            | openssl x509 -noout -subject -nameopt RFC2253 \
            | sed -n 's/.*OU=\([0-9A-Z]\{10\}\)\(,.*\)\{0,1\}$/\1/p')
          if ! [[ "$TEAM_ID" =~ ^[0-9A-Z]{10}$ ]]; then
            echo "::error::Could not read a ten-character team identifier from the Developer ID certificate."
            exit 1
          fi
          {
            echo "CODESIGN_IDENTITY=$IDENTITY"
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "EXPECTED_TEAM_ID=$TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: Build and sign the arm64 app bundle
        # build-app.sh builds arm64 only, bakes the team into the agent and the
        # helper, builds and signs the extensions with their entitlements, and
        # signs the helper, the agent and the bundle last, all with this one
        # identity, Hardened Runtime and a secure timestamp.
        env:
          CODE_SIGN_IDENTITY: ${{ env.CODESIGN_IDENTITY }}
          EXPECTED_TEAM_ID: ${{ env.EXPECTED_TEAM_ID }}
          CODE_SIGN_TIMESTAMP: --timestamp
          STRIP_APP: '1'
          REQUIRE_EMBEDDED_TEAM_ID: 'true'
          REQUIRE_COMPILED_ICON: 'true'
        run: |
          set -euo pipefail
          ./scripts/build-app.sh
          test -d "build/app/Symaira Cockpit.app"
          REQUIRE_COMPILED_ICON=true ./scripts/verify-app-icon.sh "build/app/Symaira Cockpit.app"

      - name: Verify the app reports the release version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/check-version.sh "$VERSION" --app "build/app/Symaira Cockpit.app"

      - name: Verify the signature of every part
        # Read-only: nothing is signed here. The seal must hold, and every
        # Mach-O must carry the release signature of the certificate's team
        # (smoke-app.sh, REQUIRE_RELEASE_SIGNATURE), with the extensions'
        # sandbox and the app group entitlements still in place.
        run: |
          set -euo pipefail
          APP_PATH="build/app/Symaira Cockpit.app"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          REQUIRE_RELEASE_SIGNATURE=true ./scripts/smoke-app.sh "$APP_PATH"

      - name: Verify the fan helper identity and hardened runtime
        # The helper accepts only the app and the app accepts only the helper,
        # both pinned to the team embedded at build time (read from the
        # certificate) *and* to the team of their own signature. Fail the
        # release rather than ship a pair that would refuse to talk to each
        # other, a helper without the hardened runtime, or a signature that is
        # weaker than the requirement the code enforces at runtime. The
        # requirement strings come from the helper binary itself, so this step
        # cannot drift from the code.
        run: |
          set -euo pipefail
          APP_PATH="build/app/Symaira Cockpit.app"
          HELPER_ID="com.symaira.symtune-helper"
          HELPER_PATH="$APP_PATH/Contents/Library/LaunchServices/$HELPER_ID"
          APP_INFO=$(codesign -dvv "$APP_PATH" 2>&1)
          HELPER_INFO=$(codesign -dvv "$HELPER_PATH" 2>&1)
          TEAM=$(sed -n 's/^TeamIdentifier=//p' <<<"$APP_INFO")
          HELPER_TEAM=$(sed -n 's/^TeamIdentifier=//p' <<<"$HELPER_INFO")
          if [ -z "$TEAM" ] || [ "$TEAM" != "$HELPER_TEAM" ] || [ "$TEAM" != "$EXPECTED_TEAM_ID" ]; then
            echo "::error::App team '$TEAM', helper team '$HELPER_TEAM' and the certificate team '$EXPECTED_TEAM_ID' must match and be non-empty."
            exit 1
          fi
          EMBEDDED=$("$HELPER_PATH" --print-embedded-team)
          if [ "$EMBEDDED" != "$TEAM" ]; then
            echo "::error::The helper embeds team '$EMBEDDED', but the bundle is signed by '$TEAM'."
            exit 1
          fi
          grep -q "^Identifier=$HELPER_ID$" <<<"$HELPER_INFO"
          grep -Eq "flags=0x[0-9a-f]+\(.*runtime.*\)" <<<"$HELPER_INFO"
          HELPER_REQUIREMENT=$("$HELPER_PATH" --print-requirement helper "$TEAM")
          APP_REQUIREMENT=$("$HELPER_PATH" --print-requirement app "$TEAM")
          codesign --verify --strict --verbose=2 -R="$HELPER_REQUIREMENT" "$HELPER_PATH"
          codesign --verify --strict --verbose=2 -R="$APP_REQUIREMENT" "$APP_PATH"

      - name: Notarize and staple the app
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          APP_PATH="build/app/Symaira Cockpit.app"
          SUBMISSION_ARCHIVE="$RUNNER_TEMP/app-notarization.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$SUBMISSION_ARCHIVE"
          ./scripts/notarize.sh "$SUBMISSION_ARCHIVE"
          rm -f "$SUBMISSION_ARCHIVE"
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"

      - name: Package release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          APP_PATH="build/app/Symaira Cockpit.app"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/Symaira-Cockpit-${VERSION}.zip"
          ./scripts/create-symaira-dmg.sh \
            "$APP_PATH" \
            "dist/Symaira-Cockpit-${VERSION}-macos.dmg" \
            "Symaira Cockpit"

      - name: Sign and verify the DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          DMG_PATH="dist/Symaira-Cockpit-${VERSION}-macos.dmg"
          if [ -z "${CODESIGN_IDENTITY:-}" ]; then
            echo "::error::CODESIGN_IDENTITY is required before signing the DMG."
            exit 1
          fi
          codesign --force --sign "$CODESIGN_IDENTITY" --timestamp "$DMG_PATH"
          codesign --verify --strict --verbose=2 "$DMG_PATH"

      - name: Notarize and staple the DMG
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          DMG_PATH="dist/Symaira-Cockpit-${VERSION}-macos.dmg"
          ./scripts/notarize.sh "$DMG_PATH"
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          codesign --verify --strict --verbose=2 "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG_PATH"

      - name: Verify the app inside the DMG
        # What a user drags to /Applications: the stapled, release-signed app,
        # with the command line the cask links.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          DMG_PATH="dist/Symaira-Cockpit-${VERSION}-macos.dmg"
          MOUNT="$RUNNER_TEMP/dmg-mount"
          mkdir -p "$MOUNT"
          hdiutil attach "$DMG_PATH" -readonly -nobrowse -noverify -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT" -quiet || true' EXIT
          APP="$MOUNT/Symaira Cockpit.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          REQUIRE_RELEASE_SIGNATURE=true ./scripts/smoke-app.sh "$APP"
          ./scripts/check-version.sh "$VERSION" --app "$APP"

      - name: Upload app artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            dist/Symaira-Cockpit-*.zip \
            dist/Symaira-Cockpit-*-macos.dmg \
            --clobber

      - name: Verify published DMG bytes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ASSET="Symaira-Cockpit-${VERSION}-macos.dmg"
          LOCAL_PATH="dist/${ASSET}"
          DOWNLOAD_DIR="$RUNNER_TEMP/published-release"
          mkdir -p "$DOWNLOAD_DIR"
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "$ASSET" \
            --dir "$DOWNLOAD_DIR"
          PUBLISHED_PATH="$DOWNLOAD_DIR/$ASSET"
          test -f "$LOCAL_PATH"
          test -f "$PUBLISHED_PATH"
          LOCAL_SHA=$(shasum -a 256 "$LOCAL_PATH" | awk '{print $1}')
          PUBLISHED_SHA=$(shasum -a 256 "$PUBLISHED_PATH" | awk '{print $1}')
          echo "Local DMG SHA-256: $LOCAL_SHA"
          echo "Published DMG SHA-256: $PUBLISHED_SHA"
          if [ "$LOCAL_SHA" != "$PUBLISHED_SHA" ]; then
            echo "::error::Published DMG bytes differ from the verified workspace artifact."
            exit 1
          fi
          cmp -s "$LOCAL_PATH" "$PUBLISHED_PATH"
          codesign --verify --strict --verbose=2 "$PUBLISHED_PATH"
          xcrun stapler validate "$PUBLISHED_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$PUBLISHED_PATH"

      - name: Clean up signing material
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi

  # ---------------------------------------------------------------------------
  # Homebrew distribution. Updates Formula (CLI tarball only) and Cask (app and
  # the CLI inside it) in danieljustus/homebrew-tap once every artifact exists
  # on the release, so the tap can never point at a partial release. The Ruby
  # files come from packaging/homebrew/ through scripts/render-homebrew.sh:
  # no shell heredoc ever touches the `#{version}` interpolation.
  # ---------------------------------------------------------------------------
  bump-homebrew:
    name: Bump Homebrew formula and cask
    runs-on: ubuntu-latest
    environment: release
    needs: release-macos-app
    # GITHUB_TOKEN only downloads release assets here; the tap is written with
    # HOMEBREW_TAP_GITHUB_TOKEN.
    permissions:
      contents: read
    steps:
      - name: Checkout the tagged source (templates and scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: src
          persist-credentials: false

      - name: Checkout Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: danieljustus/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: homebrew-tap

      - name: Download release artifacts and compute checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          gh release download "${GITHUB_REF_NAME}" \
            --repo danieljustus/symaira-cockpit \
            --pattern "symcockpit_${VERSION}_darwin_arm64.tar.gz" \
            --pattern "Symaira-Cockpit-${VERSION}-macos.dmg" \
            --pattern "checksums.txt" \
            --dir artifacts
          TAR_SHA256=$(shasum -a 256 "artifacts/symcockpit_${VERSION}_darwin_arm64.tar.gz" | awk '{print $1}')
          DMG_SHA256=$(shasum -a 256 "artifacts/Symaira-Cockpit-${VERSION}-macos.dmg" | awk '{print $1}')
          # The tarball must be the one the release job checksummed.
          if ! grep -q "^${TAR_SHA256}  symcockpit_${VERSION}_darwin_arm64.tar.gz$" artifacts/checksums.txt; then
            echo "::error::The published CLI tarball does not match checksums.txt."
            exit 1
          fi
          {
            echo "VERSION=$VERSION"
            echo "TAR_SHA256=$TAR_SHA256"
            echo "DMG_SHA256=$DMG_SHA256"
          } >> "$GITHUB_ENV"

      - name: Write formula and cask
        run: |
          set -euo pipefail
          mkdir -p homebrew-tap/Formula homebrew-tap/Casks
          ./src/scripts/render-homebrew.sh formula "$VERSION" "$TAR_SHA256" > homebrew-tap/Formula/symcockpit.rb
          ./src/scripts/render-homebrew.sh cask "$VERSION" "$DMG_SHA256" > homebrew-tap/Casks/symcockpit.rb
          ruby -c homebrew-tap/Formula/symcockpit.rb
          ruby -c homebrew-tap/Casks/symcockpit.rb
          # The interpolation must have survived: a heredoc once wrote it away.
          grep -q 'releases/download/v#{version}/Symaira-Cockpit-#{version}-macos.dmg' homebrew-tap/Casks/symcockpit.rb
          grep -q "symcockpit_${VERSION}_darwin_arm64.tar.gz" homebrew-tap/Formula/symcockpit.rb
          grep -q "version \"${VERSION}\"" homebrew-tap/Casks/symcockpit.rb

      - name: Publish formula and cask through a pull request
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/symcockpit.rb Casks/symcockpit.rb
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          branch="homebrew/symcockpit-${VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git commit -m "Bump symcockpit to v${VERSION}"
          git push --set-upstream origin "$branch"
          head=$(git rev-parse HEAD)
          pr=$(gh pr create --repo danieljustus/homebrew-tap \
            --base main --head "$branch" \
            --title "Bump symcockpit to v${VERSION}" \
            --body "Update the CLI formula (arm64 tarball) and the app cask (DMG, links the bundled CLI) from the published Cockpit v${VERSION} assets and their exact SHA-256 checksums.")
          gh pr merge "$pr" --repo danieljustus/homebrew-tap \
            --squash --auto --match-head-commit "$head"
          # Tap CI can queue for a long time under runner contention; v0.9.0
          # gave up 7 s before its tap PR merged. Wait up to 45 minutes, then
          # read the state once more so a just-merged PR is not a failure.
          deadline=$((SECONDS + 45 * 60))
          state=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            state=$(gh pr view "$pr" --repo danieljustus/homebrew-tap --json state --jq .state)
            if [ "$state" = MERGED ]; then
              exit 0
            fi
            if [ "$state" = CLOSED ]; then
              echo "::error::Homebrew update PR was closed without merging: $pr"
              exit 1
            fi
            sleep 20
          done
          state=$(gh pr view "$pr" --repo danieljustus/homebrew-tap --json state --jq .state)
          if [ "$state" = MERGED ]; then
            exit 0
          fi
          echo "::error::Homebrew update PR is still ${state} after 45 minutes: $pr"
          exit 1
