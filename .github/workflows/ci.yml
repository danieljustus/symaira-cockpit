name: CI

# No workflow-level path filter: a workflow that never starts leaves the
# required checks missing and blocks the merge. Job selection happens per job
# through the `changes` job instead, and a skipped job still reports its check.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Hosted macOS runners queue for hours, so start only the jobs a change can
  # affect. scripts/ci-changed-areas.sh maps changed paths to jobs and runs
  # everything for a path it does not know.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      tuning: ${{ steps.detect.outputs.tuning }}
      history: ${{ steps.detect.outputs.history }}
      root: ${{ steps.detect.outputs.root }}
      icon: ${{ steps.detect.outputs.icon }}
      make: ${{ steps.detect.outputs.make }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check the path-to-job table
        run: ./scripts/test-ci-changed-areas.sh

      - name: Detect affected jobs
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # A pull_request checkout is the test merge commit, so its first
          # parent is the base it will merge into. A push compares against
          # the previous tip; without one (new branch, force push) run all.
          if [ "$EVENT_NAME" = pull_request ]; then
            range=(HEAD^1 HEAD)
          elif [ "$EVENT_NAME" = push ] && [ -n "$BEFORE" ] \
            && ! [[ "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range=("$BEFORE" HEAD)
          else
            range=()
          fi
          if [ "${#range[@]}" -eq 2 ]; then
            git diff --name-only "${range[@]}" > "$RUNNER_TEMP/changed.txt"
          else
            echo "Makefile" > "$RUNNER_TEMP/changed.txt"  # forces the full set
          fi
          echo "Changed paths:"; cat "$RUNNER_TEMP/changed.txt"
          ./scripts/ci-changed-areas.sh < "$RUNNER_TEMP/changed.txt" | tee -a "$GITHUB_OUTPUT"

  # One job per package so a failure is attributable by name. The names are
  # static on purpose: `root` and `history` are required checks, and a skipped
  # matrix job reports only its unexpanded name, which would leave them
  # missing. Every macOS job uses `!cancelled() && ... != 'false'` so that a
  # broken `changes` job runs everything instead of skipping it.
  # macOS-only code (AppKit/IOKit/AX) — no ubuntu leg.
  # macos-latest rather than macos-15: tuning targets Xcode 27 (Swift 6.4) and
  # the older runner's Swift 6.0 rejects @unchecked Sendable boundaries that
  # 6.4 accepts.
  tuning:
    name: tuning
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.tuning != 'false' }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: tuning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Prefer the Xcode-beta toolchain when present (actool for the app
      # targets), otherwise fall back to the runner's default swift.
      - name: Select toolchain
        run: |
          if [ -d /Applications/Xcode-beta.app/Contents/Developer ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode-beta.app/Contents/Developer" >> "$GITHUB_ENV"
          fi

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  history:
    name: history
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.history != 'false' }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: history
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Prefer the Xcode-beta toolchain when present (actool for the app
      # targets), otherwise fall back to the runner's default swift.
      - name: Select toolchain
        run: |
          if [ -d /Applications/Xcode-beta.app/Contents/Developer ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode-beta.app/Contents/Developer" >> "$GITHUB_ENV"
          fi

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  # The dispatcher package at the repo root.
  root:
    name: root
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.root != 'false' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Prefer the Xcode-beta toolchain when present (actool for the app
      # targets), otherwise fall back to the runner's default swift.
      - name: Select toolchain
        run: |
          if [ -d /Applications/Xcode-beta.app/Contents/Developer ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode-beta.app/Contents/Developer" >> "$GITHUB_ENV"
          fi

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        # The dispatcher package (root) carries the E2E suites that spawn the
        # built `symcockpit` binary — `swift test` there runs them.
        run: swift test

      - name: Release app build
        run: |
          set -euo pipefail
          release_log="$RUNNER_TEMP/cockpit-release-build.log"
          swift build --product SymCockpitApp -c release --jobs 2 2>&1 | tee "$release_log"
          python3 - "$release_log" <<'PY'
          import re
          import sys
          from pathlib import Path

          diagnostic = re.compile(
              r"(?:BrightnessHUDPanel|MenuBarVisibilityCard|TuneViewModel|ProcessUsageService)"
              r"\.swift:\d+(?::\d+)?:\s*(?:warning|error):"
          )
          reported = [line for line in Path(sys.argv[1]).read_text().splitlines() if diagnostic.search(line)]
          if reported:
              raise SystemExit("Reported Swift diagnostics remain:\n" + "\n".join(reported))
          PY

      # Keep DMG validation inside the required root check as well as the
      # separate Xcode-26 icon check, so auto-merge cannot outrun it.
      - name: Native app icon and DMG smoke
        run: ./scripts/test-app-icon.sh

  # Compile the shipped .icon with the release Xcode before a tag can reach
  # the GUI release path. The regular Swift matrix does not exercise actool.
  icon-compile:
    name: app icon compile
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.icon != 'false' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.4.1'
      - name: Verify Xcode toolchain
        run: |
          set -euo pipefail
          XCODE_VERSION="$(xcodebuild -version)"
          echo "$XCODE_VERSION"
          XCODE_MAJOR="${XCODE_VERSION#Xcode }"
          XCODE_MAJOR="${XCODE_MAJOR%%.*}"
          if ! [[ "$XCODE_MAJOR" =~ ^[0-9]+$ ]] || (( XCODE_MAJOR < 26 )); then
            echo "::error::Expected Xcode 26 or newer, got: $XCODE_VERSION" >&2
            exit 1
          fi
      - name: Compile and inspect native icon
        run: ./scripts/test-app-icon.sh

  # The release workflow gates on `make test`. That gate is only real if a
  # failing package makes the recipe exit non-zero, so assert it whenever the
  # Makefile or this check changes. Stays on macos-latest to exercise the same
  # (older, Apple-shipped GNU 3.81) make as the release job; the check itself
  # stubs the toolchain and needs no Swift build.
  make-gate:
    name: make failure propagation
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.make != 'false' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Assert make build/test propagate a package failure
        run: ./scripts/check-make-propagation.sh

  # Coverage tracking only — main-branch pushes, not a PR check. Keeps PR
  # checks fast (see the package jobs above) while still recording coverage
  # figures for tuning/history over time.
  coverage:
    if: github.event_name == 'push'
    name: coverage (${{ matrix.pkg }})
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ${{ matrix.pkg }}
    strategy:
      fail-fast: false
      matrix:
        pkg: [tuning, history]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select toolchain
        run: |
          if [ -d /Applications/Xcode-beta.app/Contents/Developer ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode-beta.app/Contents/Developer" >> "$GITHUB_ENV"
          fi

      - name: Test with coverage
        run: swift test --enable-code-coverage

      - name: Coverage report
        run: |
          # No fixed path assumption: the Xcode build system (used when
          # Xcode-beta is selected) writes to .build/out/Products/Debug/ with
          # one bundle per test target, while plain `swift build` writes to
          # .build/<triple>/debug/ with one combined <Package>PackageTests
          # bundle — this must work under either.
          binaries=()
          while IFS= read -r b; do
            name=$(basename "$b" .xctest)
            if [ -x "$b/Contents/MacOS/$name" ]; then
              binaries+=("$b/Contents/MacOS/$name")
            else
              binaries+=("$b")
            fi
          done < <(find .build -iname "*.xctest" -type d)
          profdata=$(find .build -iname "default.profdata" | head -1)
          # No source-path filter: passing one reliably confuses this
          # runner's llvm-cov (rejects directories outright, and rejects
          # individual file paths as "not a valid object file" once more
          # than one test binary is on the command line). The unfiltered
          # report includes dependency/test-target rows too, which is an
          # acceptable trade-off for a main-branch-only tracking job.
          {
            echo "### Coverage — ${{ matrix.pkg }}"
            echo '```'
            xcrun llvm-cov report "${binaries[@]}" -instr-profile "$profdata"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
