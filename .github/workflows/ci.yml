name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Packages: the three nested tool packages plus the symcockpit dispatcher
  # package at the repo root. Matrix per package so a failure is attributable
  # by name. macOS-only code (AppKit/IOKit/AX) — no ubuntu leg.
  # macos-latest rather than macos-15: tune targets Xcode 27 (Swift 6.4) and
  # the older runner's Swift 6.0 rejects @unchecked Sendable boundaries that
  # 6.4 accepts.
  swift:
    name: ${{ matrix.pkg }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ${{ matrix.pkg == 'root' && '.' || matrix.pkg }}
    strategy:
      fail-fast: false
      matrix:
        pkg: [tune, operate, scope, root]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Prefer the Xcode-beta toolchain when present (actool for the app
      # targets), otherwise fall back to the runner's default swift.
      - name: Select toolchain
        run: |
          if [ -d /Applications/Xcode-beta.app/Contents/Developer ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode-beta.app/Contents/Developer" >> "$GITHUB_ENV"
          fi

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        # The dispatcher package (root) carries the E2E suites that spawn the
        # built `symcockpit` binary — `swift test` there runs them.
        run: swift test

  # Coverage tracking only — main-branch pushes, not a PR check. Keeps PR
  # checks fast (see the `swift` job above) while still recording coverage
  # figures for tune/operate/scope over time.
  coverage:
    if: github.event_name == 'push'
    name: coverage (${{ matrix.pkg }})
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ${{ matrix.pkg }}
    strategy:
      fail-fast: false
      matrix:
        pkg: [tune, operate, scope]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select toolchain
        run: |
          if [ -d /Applications/Xcode-beta.app/Contents/Developer ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode-beta.app/Contents/Developer" >> "$GITHUB_ENV"
          fi

      - name: Test with coverage
        run: swift test --enable-code-coverage

      - name: Coverage report
        run: |
          bundle=$(find .build -maxdepth 4 -iname "*.xctest" -path "*/Products/Debug/*" | tr '\n' ' ')
          profdata=$(find .build -iname "default.profdata" | head -1)
          binaries=""
          for b in $bundle; do
            name=$(basename "$b" .xctest)
            binaries="$binaries $b/Contents/MacOS/$name"
          done
          # Pass explicit source files, not the directory: some llvm-cov
          # versions reject a directory as the source-file filter.
          sources=$(find Sources -name "*.swift" | tr '\n' ' ')
          {
            echo "### Coverage — ${{ matrix.pkg }}"
            echo '```'
            xcrun llvm-cov report $binaries -instr-profile "$profdata" $sources
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
