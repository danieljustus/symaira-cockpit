# Temporary probe for the v0.9.0 release failure; removed before merge.
name: Metal probe
on:
  pull_request:
    paths: [.github/workflows/metal-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    name: metal wrap ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-26]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Select Xcode 26.4.1 (app job)
        if: matrix.runner == 'macos-26'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.4.1'
      - name: Route Metal shims to the installed toolchain
        run: |
          set -euo pipefail
          bash scripts/ci-metal-toolchain.sh
      - name: Universal release build
        run: |
          set -o pipefail
          swift build -c release --arch arm64 --arch x86_64 2>&1 | tail -4
          find .build -name default.metallib -path '*SymairaTheme*' | tee /dev/stderr | grep -q .
