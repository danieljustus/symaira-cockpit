# Temporary probe for the v0.9.0 release failure; removed before merge.
name: Metal probe
on:
  pull_request:
    paths: [.github/workflows/metal-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    name: metal ${{ matrix.runner }} ${{ matrix.method }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-26]
        method: [nosandbox, perarch]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Select Xcode 26.4.1 (app job)
        if: matrix.runner == 'macos-26'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.4.1'
      - name: Toolchain state
        run: |
          xcodebuild -version
          xcodebuild -showComponent MetalToolchain || true
          xcrun metal --version
      - name: Universal build without sandbox
        if: matrix.method == 'nosandbox'
        run: |
          swift build -c release --arch arm64 --arch x86_64 --disable-sandbox
          find .build -name default.metallib -path '*SymairaTheme*' | head
      - name: Per-arch native builds + lipo
        if: matrix.method == 'perarch'
        run: |
          set -euo pipefail
          for a in arm64 x86_64; do swift build -c release --arch "$a" --product symcockpit; swift build -c release --arch "$a" --product SymCockpitApp; done
          find .build -name default.metallib | head
          find .build -name '*SymairaTheme.bundle' -maxdepth 4 | while read b; do ls "$b" "$b/Contents/Resources" 2>/dev/null; done
