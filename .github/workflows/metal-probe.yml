# Temporary probe for the v0.9.0 release failure; removed before merge.
name: Metal probe
on:
  pull_request:
    paths: [.github/workflows/metal-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    name: metal ${{ matrix.xcode }}
    strategy:
      fail-fast: false
      matrix:
        xcode: [default, xcode27]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Select Xcode
        env:
          WANT: ${{ matrix.xcode }}
        run: |
          ls -d /Applications/Xcode*.app
          if [ "$WANT" = xcode27 ]; then
            x=$(ls -d /Applications/Xcode_27*.app /Applications/Xcode-beta.app 2>/dev/null | sort -V | tail -1)
            echo "DEVELOPER_DIR=$x/Contents/Developer" >> "$GITHUB_ENV"
          fi
      - name: Toolchain state
        run: |
          xcodebuild -version
          xcodebuild -showComponent MetalToolchain || true
          xcodebuild -showComponent MetalToolchain | grep -q 'Status: installed' || xcodebuild -downloadComponent MetalToolchain
          xcrun metal --version
          swift --version
      - name: Universal release build (verbose)
        run: |
          set -o pipefail
          swift build -c release --arch arm64 --arch x86_64 -v 2>&1 | tee build.log | tail -5
      - name: Metal invocation
        if: always()
        run: |
          grep -n -i -B2 -A8 'CompileMetalFile\|SymairaTopo.metal' build.log | cut -c1-600 | head -60
          find .build -name default.metallib | head
