# Temporary probe for the v0.9.0 release failure; removed before merge.
name: Metal probe
on:
  pull_request:
    paths: [.github/workflows/metal-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    name: metal shim
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Shim resolution
        run: |
          set +e
          DEV=$(xcode-select -p); SHIM="$DEV/Toolchains/XcodeDefault.xctoolchain/usr/bin/metal"
          echo "DEV=$DEV"; ls -l "$SHIM"; file "$SHIM"
          TC=$(xcodebuild -showComponent MetalToolchain | sed -n 's/^Toolchain Identifier: //p'); echo "TC=$TC"
          echo "--- plain";         "$SHIM" --version; echo "rc=$?"
          echo "--- DEVELOPER_DIR"; DEVELOPER_DIR="$DEV" "$SHIM" --version; echo "rc=$?"
          echo "--- TOOLCHAINS";    TOOLCHAINS="$TC" "$SHIM" --version; echo "rc=$?"
          echo "--- xcrun";         xcrun metal --version; echo "rc=$?"
          echo "--- env -i";        env -i PATH=/usr/bin:/bin HOME="$HOME" "$SHIM" --version; echo "rc=$?"
          echo "--- env -i + DEV";  env -i PATH=/usr/bin:/bin HOME="$HOME" DEVELOPER_DIR="$DEV" "$SHIM" --version; echo "rc=$?"
          echo "--- env -i + TC";   env -i PATH=/usr/bin:/bin HOME="$HOME" TOOLCHAINS="$TC" "$SHIM" --version; echo "rc=$?"
          exit 0
      - name: Build with DEVELOPER_DIR exported
        run: |
          export DEVELOPER_DIR=$(xcode-select -p)
          swift build -c release --arch arm64 --arch x86_64 2>&1 | tail -4
          find .build -name default.metallib | head
