name: "CodeQL"

on:
  push:
    branches: [main]
    paths:
      - '**/*.swift'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Swift-only by construction: every package in this repository is Swift.
# macos-latest because the code drives AppKit/IOKit/AX and needs a macOS SDK
# to build under analysis at all.
jobs:
  analyze:
    name: Analyze
    runs-on: macos-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select toolchain
        run: |
          if [ -d /Applications/Xcode-beta.app/Contents/Developer ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode-beta.app/Contents/Developer" >> "$GITHUB_ENV"
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: swift

      - name: Build for analysis
        run: |
          # The app target needs an Xcode toolchain (actool); plain swift build
          # covers the dispatcher plus all three family packages, which is what
          # CodeQL should see. Nested packages resolve via the root Package.swift.
          swift build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: "/language:swift"
