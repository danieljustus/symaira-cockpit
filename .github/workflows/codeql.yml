name: "CodeQL"

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Swift-only by construction: every package in this repository is Swift.
# macos-latest because the code drives AppKit/IOKit/AX and needs a macOS SDK
# to build under analysis at all.
jobs:
  analyze:
    name: Analyze
    runs-on: macos-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select toolchain
        run: |
          if [ -d /Applications/Xcode-beta.app/Contents/Developer ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode-beta.app/Contents/Developer" >> "$GITHUB_ENV"
          fi

      # Resolve the locked SwiftPM graph before CodeQL installs its build
      # tracer. SwiftPM's resolver can otherwise block on macOS 26 while the
      # tracer is active, even though all versions are already pinned.
      - name: Resolve SwiftPM dependencies
        run: swift package resolve --only-use-versions-from-resolved-file

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: swift
          build-mode: manual

      - name: Build for analysis
        run: |
          # Keep the traced build locked to the resolved graph and one
          # architecture. SwiftPM's default driver is required here: forcing
          # the legacy driver produces Swift module type mismatches under the
          # CodeQL tracer.
          swift build --arch arm64 --only-use-versions-from-resolved-file

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          category: "/language:swift"
